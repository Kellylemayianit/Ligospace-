<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L.I.G.O. SPACE — Humanity First. Every Life Matters.</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#12263a;--mute:#51606f;--line:#d9e0da;--sun:#f2b01e;--sun-ink:#3a2a00;--acacia:#1e6b52;--deep:#12263a;--on-deep:#f6f8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a27;--card:#14263a;--ink:#eef2ee;--mute:#a5b3bf;--line:#26405a;--acacia:#5fc4a0;--deep:#081420}}
:root[data-theme="dark"]{--bg:#0d1a27;--card:#14263a;--ink:#eef2ee;--mute:#a5b3bf;--line:#26405a;--acacia:#5fc4a0;--deep:#081420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.6rem)}h2{font-size:clamp(1.5rem,3.5vw,2.2rem)}h3{font-size:1.15rem}
p{margin:0 0 1em;max-width:68ch}a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:48px 0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);color:var(--on-deep)}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.04em;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;font-size:.92rem;opacity:.85}
nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12)}
.btn{display:inline-block;border:2px solid var(--sun);background:var(--sun);color:var(--sun-ink);font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.sm{padding:5px 12px;font-size:.88rem}
.hero{background:var(--deep);color:var(--on-deep);position:relative;overflow:hidden;padding:72px 0 64px}
.hero svg{position:absolute;right:-120px;top:-140px;width:640px;max-width:none;opacity:.9;pointer-events:none}
.hero .wrap{position:relative}
.hero .lede{font-size:1.15rem;color:#cfd9e2}
.hero .crown{color:var(--sun);font-family:Georgia,serif;font-size:1.25rem;margin-bottom:.8em}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card p{margin:0;color:var(--mute);font-size:.95rem}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.path span.arr{color:var(--sun)}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid}
.b-operational{color:var(--acacia);border-color:var(--acacia)}
.b-developing{color:#9a6a00;border-color:#c38a00}
.b-future{color:var(--mute);border-color:var(--mute);border-style:dashed}
.b-approval{color:#a33a2f;border-color:#a33a2f}
.cols3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.col h3{border-bottom:3px solid var(--sun);padding-bottom:6px}
.col ul{list-style:none;padding:0;margin:0}.col li{padding:9px 0;border-bottom:1px solid var(--line)}
.col li small{display:block;color:var(--mute)}
.shs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.shs .card{border-top:4px solid var(--acacia)}
.quote{font-family:Georgia,serif;font-size:1.3rem;border-left:4px solid var(--sun);padding-left:16px;margin:0 0 20px}
.note{background:color-mix(in srgb,var(--sun) 18%,var(--card));border:1px solid var(--sun);border-radius:8px;padding:12px 16px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pick:hover{border-color:var(--acacia)}
form{display:grid;gap:12px;max-width:560px}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--acacia);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.metric{display:grid;gap:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.nums b{display:block;font:700 1.6rem Georgia,serif}.nums small{color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--sun)}.bar u{position:absolute;left:0;top:0;bottom:0;background:var(--acacia)}
details{font-size:.9rem;color:var(--mute)}summary{cursor:pointer}
.nums input{width:100%;text-align:center}
footer{background:var(--deep);color:var(--on-deep);padding:36px 0}
footer p{color:#b9c6d2;margin:0 0 .4em}
.table{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CORE: tiny component runtime (React-like, no dependencies) ============ */
const h=(t,p={},...c)=>{const e=document.createElement(t);for(const k in p){const v=p[k];if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v)}c.flat(Infinity).forEach(x=>x!=null&&x!==false&&e.append(x.nodeType?x:document.createTextNode(x)));return e};
const store=(()=>{let s={},subs=[];return{get:k=>s[k],set(k,v){s[k]=v;subs.forEach(f=>f(k))},sub:f=>subs.push(f),init:o=>{s={...o}}}})();
const disk={get(k,d){try{const v=localStorage.getItem('ligo:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ligo:'+k,JSON.stringify(v))}catch(e){}}};

/* ============ DATA LAYER: swap for a real backend later (Phase 2+) ============ */
const api={
  saveSubmission(rec){const all=disk.get('submissions',[]);all.push({...rec,at:new Date().toISOString()});disk.set('submissions',all);return Promise.resolve({ok:true})},
  impact:()=>disk.get('impact',null),
  saveImpact:v=>disk.set('impact',v)
};
const STATUS={operational:'Operational',developing:'Developing',future:'Future initiative',approval:'Subject to registration / approval'};
const INITIATIVES=[
 {n:'Community Outreach',s:'operational'},{n:'Youth Mentorship',s:'operational'},{n:'Talent & Creativity',s:'operational'},
 {n:'Digital Library',s:'developing'},{n:'AI Learning Assistant',s:'developing'},{n:'Opportunity Circle',s:'developing'},
 {n:'L.I.G.O. Vocational Training Center',s:'future',r:'Subject to applicable TVET registration and licensing (TVETA).'},
 {n:'L.I.G.O. SACCO',s:'future',r:'Not operational. Subject to registration and authorization (SASRA). No deposits or financial products are offered.'},
 {n:'L.I.G.O. University',s:'future',r:'Long-term vision only. Subject to higher-education requirements and accreditation (CUE).'},
 {n:'L.I.G.O. App',s:'future'},{n:'L.I.G.O. Academy',s:'future'},{n:'Innovation & Incubation Centers',s:'future'}
];
const SHS=[['Body','Physical wellbeing, energy, health, habits.'],['Mind','Thoughts, learning, reasoning, decisions.'],['Emotion / Heart','Emotional awareness and regulation.'],['Identity / Self','Personal value, strengths, story.'],['Relational / Social','Family, friendship, belonging.'],['Purpose','Meaning, direction, contribution.']];
const OPP_TYPES=['Jobs','Training','Scholarships','Mentorship','Volunteering','Fellowships','Partnerships','Entrepreneurship','Community'];
const INDICATORS=[['reached','People reached',0],['youth','Youth engaged'],['schools','Schools / institutions engaged'],['volunteers','Volunteers mobilized'],['mentors','Mentors / professionals onboarded'],['sessions','Training sessions delivered'],['initiatives','Community initiatives conducted'],['academic','Academic / technical collaborators'],['partners','Strategic partners'],['connections','Employment / opportunity connections']].map(([k,l])=>({k,l,target:0,achieved:0,verified:0}));
const EVIDENCE=['Program','Date','Location','Partner','Activity','Outcome','Photos / documentation','Verification / report'];

/* Funnel config: one generic form renders every pathway from this schema */
const T='text',E='email',TA='textarea';
const base=[['name','Full name',T],['email','Email',E],['phone','Phone (optional)',T]];
const org=[['org','Organization',T],['role','Your role',T]];
const PATHWAYS={
 partner:{label:'Partner with us',items:[
  ['academic','Academic / Research Partner','Research, validation and academic engagement.',[...org,['interest','Research area or interest',TA]]],
  ['corporate','Corporate / Institutional Partner','Bring your organization\u2019s capacity and expertise.',[...org,['offer','What could you contribute?',TA]]],
  ['sponsor','Sponsor / Donor','Support approved initiatives.',[['org','Organization (if any)',T],['support','Type of support',['Financial','In-kind','Not sure yet']],['note','Anything we should know?',TA]]],
  ['international','International Partner','Collaborate across borders.',[...org,['country','Country',T],['offer','Collaboration idea',TA]]],
  ['community','Community / Strategic Partner','Work with us on local and strategic goals.',[...org,['offer','How could we work together?',TA]]],
  ['tech','Technology / Innovation Partner','Technology, tools and innovation.',[...org,['offer','Technology or expertise offered',TA]]],
  ['school','School / Education Partner','Schools and learning institutions.',[['org','School / institution',T],['level','Level',['Primary','Secondary / SHS','TVET / College','University']],['interest','What are you looking for?',TA]]],
  ['expert','Professional / Expert Partner','Share specialist knowledge.',[['field','Field of expertise',T],['offer','How would you like to contribute?',TA]]]]},
 involve:{label:'Get involved',items:[
  ['volunteer','Volunteer','Give your time, skills and experience.',[['area','Area of interest',T],['avail','Availability',['Weekdays','Weekends','Flexible']]]],
  ['youth','Youth Participant','Join mentorship and programs.',[['age','Age',T],['interest','What would you like to learn or build?',TA]]],
  ['founding','Founding Member','Help establish the institution.',[['why','Why would you like to join?',TA]]],
  ['mentor','Mentor','Share what you know.',[['field','Field / experience',T],['avail','Availability',['Weekly','Monthly','Occasionally']]]],
  ['skills','Professional / Skills Contributor','Contribute professional skills.',[['skill','Your skill',T],['offer','How would you like to help?',TA]]],
  ['opportunity','Opportunity / Employment Connection','Submit a job, training, scholarship or other opportunity.',[['org','Organization',T],['type','Opportunity type',OPP_TYPES],['detail','Describe the opportunity',TA]]],
  ['participant','Community Participant','Be part of the wider community.',[['loc','Where are you based?',T],['interest','What interests you?',TA]]]]}
};
const NEXT=['We receive your submission and send a confirmation.','Our team reviews it within a few working days.','We contact you about the next step that fits you.'];

/* ============ COMPONENTS ============ */
const Badge=s=>h('span',{class:'badge b-'+s},STATUS[s]);
const Link=(href,text,cls='')=>h('a',{href:'#'+href,class:cls},text);
const Path=(...a)=>h('div',{class:'path'},a.flatMap((x,i)=>i?[h('span',{class:'arr','aria-hidden':'true'},'\u2192'),x]:[x]));
const Rays=()=>{const n=24;let r='';for(let i=0;i<n;i++){const a=i*360/n;r+=`<line x1="320" y1="320" x2="320" y2="${i%2?60:20}" transform="rotate(${a} 320 320)" stroke="#f2b01e" stroke-width="${i%2?3:6}" stroke-linecap="round" opacity="${i%2?.45:.8}"/>`}
 const w=document.createElement('div');w.innerHTML=`<svg viewBox="0 0 640 640" aria-hidden="true">${r}<circle cx="320" cy="320" r="120" fill="none" stroke="#f2b01e" stroke-width="3"/><circle cx="320" cy="262" r="26" fill="#f2b01e"/><path d="M270 372q50-70 100 0" fill="none" stroke="#f2b01e" stroke-width="10" stroke-linecap="round"/></svg>`;return w.firstChild};
const Header=cur=>{const l=[['/','Home'],['/about','About'],['/shs','Synchronized Human System'],['/future','Future Initiatives'],['/opportunities','Opportunities'],['/impact','Impact']];
 return h('header',{class:'top'},h('div',{class:'wrap'},Link('/','L.I.G.O. SPACE','brand'),h('nav',{'aria-label':'Main'},l.map(([p,t])=>h('a',{href:'#'+p,'aria-current':cur===p?'page':null},t))),Link('/engage/partner','Partner with us','btn sm')))};
const Footer=()=>h('footer',{},h('div',{class:'wrap'},h('h3',{},'Humanity First. Every Life Matters.'),h('p',{},'What Crowns Us: Love. From Foundation to Action.'),h('p',{},'Founder & President: Samuel M.K. \u00b7 +254 791 236 179 \u00b7 Kajiado South, Kenya'),h('p',{},'Future initiatives are shown by their actual status and are not available until legally established and authorized.')));
const Section=(title,...c)=>h('section',{},h('div',{class:'wrap'},title&&h('h2',{},title),c));

/* Smart funnel */
const FunnelForm=(group,item)=>{const [id,label,blurb,extra]=item;const fields=[...base,...extra];const box=h('div');
 const form=h('form',{onsubmit:async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(form));await api.saveSubmission({group,pathway:id,...d});box.replaceChildren(h('div',{class:'note',role:'status'},h('h3',{},'Thank you, '+d.name+'.'),h('p',{},'Your '+label+' submission is saved. We will contact you at '+d.email+'.'),h('p',{},'(Prototype: submissions are stored in this browser only.)')),Link('/engage/'+group,'Choose another pathway','btn ghost'))}},
  fields.map(([n,l,t])=>h('label',{},l,Array.isArray(t)?h('select',{name:n,required:true},t.map(o=>h('option',{},o))):t===TA?h('textarea',{name:n,rows:3}):h('input',{name:n,type:t,required:n==='name'||n==='email'}))),
  h('button',{class:'btn',type:'submit'},'Send '+label+' request'));
 box.append(h('h2',{},label),h('p',{},blurb),h('h3',{},'What happens after you submit'),h('ol',{class:'steps'},NEXT.map(s=>h('li',{},s))),form);return box};

/* Impact metric: Target -> Achieved -> Verified */
const Metric=(m,admin,onChange)=>{const pct=v=>m.target?Math.min(100,v/m.target*100):0;
 const cell=(k,l)=>h('div',{},admin?h('input',{type:'number',min:0,value:m[k],'aria-label':m.l+' '+l,onchange:e=>onChange(k,+e.target.value||0)}):h('b',{},m[k]),h('small',{},l));
 return h('div',{class:'card metric'},h('h3',{},m.l),h('div',{class:'nums'},cell('target','Target'),cell('achieved','Achieved'),cell('verified','Verified')),
  h('div',{class:'bar',role:'img','aria-label':'Progress'},h('i',{style:`width:${pct(m.achieved)}%`}),h('u',{style:`width:${pct(m.verified)}%`})),
  h('details',{},h('summary',{},'Supporting evidence (0 records)'),h('p',{},'No documented activities linked yet. Each number will link to:'),h('p',{},EVIDENCE.join(' \u2192 '))))};

/* ============ PAGES ============ */
const Home=()=>h('main',{},
 h('div',{class:'hero'},Rays(),h('div',{class:'wrap'},h('h1',{},'Humanity First.',h('br'),'Every Life Matters.'),h('p',{class:'crown'},'What Crowns Us: Love.'),h('p',{class:'lede'},'A human-centered institution building pathways of dignity, opportunity, connection and purposeful living.'),h('p',{},'Founded by Samuel M.K. \u00b7 Official launch: 5 December 2026'),
  h('div',{class:'row'},Link('/about','Discover L.I.G.O. SPACE','btn'),Link('/engage/partner','Partner with us','btn ghost'),Link('/engage/involve','Get involved','btn ghost'),Link('/shs','Explore our vision','btn ghost')))),
 Section('Where you fit',h('div',{class:'path'},['Who we are','What we do','What we are building','Our impact','Where you fit','How to engage'].flatMap((t,i)=>i?[h('span',{class:'arr'},'\u2192'),t]:[t])),h('div',{class:'row'},Link('/engage/partner','I represent an organization','btn'),Link('/engage/involve','I want to take part','btn ghost'),Link('/opportunities','I\u2019m looking for opportunities','btn ghost'))),
 Section('Our roots and expansion',Path('Kajiado South','Kenya','Africa','Global ecosystem')),
 Section('The Synchronized Human System\u2122',h('p',{class:'quote'},'\u201cMost people are not necessarily lost; many are simply unsynchronized.\u201d'),h('div',{class:'shs'},SHS.map(([t,d])=>h('div',{class:'card'},h('h3',{},t),h('p',{},d)))),h('p',{style:'margin-top:14px'},'A developing framework, open to academic examination, critique and refinement.')),
 Section('Ecosystem roadmap',Roadmap()),
 Section('',h('div',{class:'card'},h('h2',{},'We cannot build alone.'),h('p',{},'Bring your expertise, technology, network, resources and experience.'),Link('/engage/partner','Let\u2019s build together','btn'))));
const Roadmap=()=>h('div',{class:'cols3'},['operational','developing','future'].map(s=>h('div',{class:'col'},h('h3',{},STATUS[s]),h('ul',{},INITIATIVES.filter(i=>i.s===s).map(i=>h('li',{},i.n,i.r&&h('small',{},i.r)))))));
const Future=()=>h('main',{},Section('Future initiatives',h('p',{},'We show our full ambition without claiming what does not yet exist. Every item carries its true status.'),Roadmap()));
const About=()=>h('main',{},Section('About L.I.G.O. SPACE',h('p',{},'People often have potential without enough access to structure, opportunity, knowledge, support or pathways. L.I.G.O. SPACE helps restore those pathways.'),h('div',{class:'grid'},[['Vision','A world where every person can live with dignity, discover their potential, develop their capabilities and contribute meaningfully to society.'],['Mission','To restore opportunity, dignity and purposeful pathways by connecting people with knowledge, relationships, resources, technology, education and practical opportunities.']].map(([t,d])=>h('div',{class:'card'},h('h3',{},t),h('p',{},d))))),
 Section('Our values',h('div',{class:'grid'},['Humanity First','Every Life Matters','Love','Dignity','Opportunity','Integrity','Community','Purpose','Stewardship'].map(v=>h('div',{class:'card'},h('h3',{},v))))));
const SHSPage=()=>h('main',{},Section('The Synchronized Human System\u2122',h('p',{},'A developing human-development framework created through the work of L.I.G.O. SPACE. It is presented as a model open to research and critique, not as established science.'),h('div',{class:'shs'},SHS.map(([t,d])=>h('div',{class:'card'},h('h3',{},t),h('p',{},d)))),h('p',{style:'margin-top:14px'},'Coming: research, publications, learning materials, videos and downloads.')));
const Opps=()=>{let f=null;const list=h('div');const draw=()=>{list.replaceChildren(h('div',{class:'tabs'},OPP_TYPES.map(t=>h('button',{class:'chip','aria-pressed':String(f===t),onclick:()=>{f=f===t?null:t;draw()}},t))),h('div',{class:'card'},h('h3',{},f?f+' opportunities':'No opportunities listed yet'),h('p',{},'Opportunities will appear here once verified. Have one to share?'),h('div',{class:'row'},Link('/engage/involve/opportunity','Submit an opportunity','btn'))))};draw();
 return h('main',{},Section('Opportunities',h('p',{},'Discover, create and access opportunities. L.I.G.O. SPACE is a platform for opportunity, not only a request for support.'),list))};
const Impact=()=>{let admin=false;let data=api.impact()||INDICATORS;const root=h('div');
 const draw=()=>{root.replaceChildren(h('div',{class:'note'},h('b',{},'Phase 1 Impact Baseline. '),'Figures are targets until activities are documented and verified. Achieved numbers are updated from documented activities.'),
  h('div',{class:'row',style:'margin:0 0 16px'},h('button',{class:'btn ghost sm',onclick:()=>{admin=!admin;draw()}},admin?'Done editing':'Edit targets (admin demo)')),
  h('div',{class:'grid'},data.map(m=>Metric(m,admin,(k,v)=>{m[k]=v;api.saveImpact(data)}))))};draw();
 return h('main',{},Section('Impact: target, achieved, verified',root))};
const Engage=([group,id])=>{const g=PATHWAYS[group]||PATHWAYS.partner;const gk=PATHWAYS[group]?group:'partner';const item=g.items.find(i=>i[0]===id);
 return h('main',{},Section(item?null:'Find where you fit',
  h('div',{class:'tabs'},Object.entries(PATHWAYS).map(([k,v])=>h('a',{class:'chip',href:'#/engage/'+k,'aria-pressed':String(k===gk)},v.label))),
  item?FunnelForm(gk,item):h('div',{class:'grid'},g.items.map(([i,l,b])=>h('a',{class:'card pick',href:`#/engage/${gk}/${i}`,style:'text-decoration:none'},h('h3',{},l),h('p',{},b))))))};

/* ============ ROUTER + APP SHELL ============ */
const routes={'':[Home,'/'],about:[About,'/about'],shs:[SHSPage,'/shs'],future:[Future,'/future'],opportunities:[Opps,'/opportunities'],impact:[Impact,'/impact'],engage:[Engage,'/engage']};
function render(){const [,seg,...rest]=(location.hash||'#/').split('/');const [Page,cur]=routes[seg||'']||routes[''];
 document.getElementById('app').replaceChildren(Header(cur),Page(rest),Footer());window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
